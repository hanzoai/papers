name: Build papers.hanzo.ai image

# Build the static papers-site image on Hanzo's own infrastructure: the
# self-hosted arcd pool (no GitHub-hosted builders, no Pages artifact quota),
# pushed to GHCR. DEPLOY is handled natively by platform.hanzo.ai (operator
# rollout onto the `papers` Service CR) — CI never touches DOKS directly.
# The build→deploy handoff is wired via the Hanzo Platform GitHub App +
# .platform.yml (see PLATFORM_CI). Until that webhook is live this workflow
# just publishes the image; the platform performs the rollout.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: papers-build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hanzoai/papers

jobs:
  build:
    runs-on: hanzo-build-linux-amd64        # self-hosted arcd (hanzoai org)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push static-site image
        uses: docker/build-push-action@v6
        with:
          context: ./site
          file: ./site/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
