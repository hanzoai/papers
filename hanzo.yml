# papers.hanzo.ai. The Dockerfile IS the gate: it runs `npm ci && npm run build`
# on the Next.js source and a broken site cannot produce an image. No test:
# block duplicating it, and no LaTeX gate here — the paper set is compiled by
# .hanzo/workflows/ci.yml (`make -k all` under texlive-full), which is the right
# home for a 219-paper, texlive-sized job.
#
# No deploy:. hanzoai/universe pins which tag is live; a build never deploys
# itself.
#
# No version: either. imgver reads the image's own context before the repo root,
# so site/package.json is where this version lives and a key here could only
# disagree with it. The series runs from there — 1.0.0, then a patch per build,
# each one derived from what is already published rather than typed.
images:
  - name: papers
    context: site
    dockerfile: site/Dockerfile
    repo: ghcr.io/hanzoai/papers
    # ONE architecture, because this image cannot take the other road. Two
    # platforms need `mode: delegate`, which builds each half natively in-cluster
    # — and the door refuses a context below the repo root, which this image has
    # (`context: site`, so a relative COPY does not read the 50 PDFs beside it).
    # So the caller is on `mode: buildx`, buildx is one runner, and one runner is
    # one architecture: declaring two here does not produce two, it produces the
    # refusal that kept this build red from 2026-09-03 to today while every
    # published tag stayed -amd64.
    #
    # The way to two architectures is to make the context the root and let the
    # door delegate — which means a .dockerignore carrying its weight, since the
    # context becomes the whole repository. Worth doing: replicas: 2 with no
    # nodeSelector can put a replica on spark, which is arm64, and a bare amd64
    # manifest there runs under qemu until it faults.
    platforms: [linux/amd64]
