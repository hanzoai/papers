name: Deploy papers.hanzo.ai

# Build + deploy the static papers site entirely on Hanzo's own infrastructure:
#   build  → self-hosted arcd pool (no GitHub-hosted builders, no Pages quota)
#   push   → ghcr.io/hanzoai/papers
#   deploy → roll the image onto the operator-managed `papers` Service CR in
#            hanzo-k8s, served via hanzoai/ingress + hanzoai/static.
#
# Replaces the old GitHub Pages deploy, which had been failing since 2026-04-10
# on the org-wide GitHub Actions artifact-storage quota (only the artifact
# upload was blocked; the self-hosted build itself was fine). This path never
# touches that quota and never uses a GitHub-hosted builder.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: papers-deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hanzoai/papers

jobs:
  build:
    runs-on: hanzo-build-linux-amd64        # self-hosted arcd (hanzoai org)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push static-site image
        uses: docker/build-push-action@v6
        with:
          context: ./site
          file: ./site/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main

  deploy:
    needs: build
    runs-on: hanzo-deploy-linux-amd64       # self-hosted arcd deploy pool (kubectl)
    steps:
      - uses: actions/checkout@v4
      - name: Auth to DOKS hanzo-k8s
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save hanzo-k8s --expiry-seconds 600
      - name: Roll image onto operator Service CR
        run: |
          set -euo pipefail
          sed "s|__TAG__|${GITHUB_SHA}|g" site/deploy/papers.service.yaml | kubectl apply -f -
          # operator reconciles the CR into a Deployment named `papers`
          for _ in $(seq 1 30); do
            kubectl -n hanzo get deploy/papers >/dev/null 2>&1 && break
            sleep 2
          done
          kubectl -n hanzo rollout status deploy/papers --timeout=180s
