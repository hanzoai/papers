# Platform-native CI/CD — hanzoai/papers (papers.hanzo.ai)
#
# deploy-site.yml builds the image and says, in its own header, that the
# build→deploy handoff is "wired via the Hanzo Platform GitHub App +
# .platform.yml". There was no .platform.yml. So the image published and
# nothing rolled: ghcr.io/hanzoai/papers carried a fresh `main` tag while
# papers.hanzo.ai kept serving the build before it, and no step anywhere was
# red about it.
#
# amd64 alone, and the reason is in hanzo.yml beside the same decision: this
# image's context is `site`, the build door refuses a context below the repo
# root, so `mode: delegate` — the only road to a second architecture — is shut
# until the context is rooted.
build:
  matrix:
    - { os: linux, arch: amd64 }
  dockerfile: site/Dockerfile
  context: site
  image: ghcr.io/hanzoai/papers
  # A semver image, from a semver git tag. The branch build publishes `main`
  # and a SHA, and a floating tag never reaches a cluster — which is the other
  # half of why the site did not move.
  tag-pattern: "{{git.tag}}"
  push: true
