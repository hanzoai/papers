# Canonical caller — every knob lives in /hanzo.yml, none here.
# Runs on the git-runner fleet at git.hanzo.ai, the only pool serving these
# labels. github.com resolves only .github/workflows and has no runner for
# them, so a caller placed there is a gate that cannot be scheduled.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    # No `mode:`, so the door builds it — one BuildKit Job per architecture, each
    # on a node of that architecture. buildx was pinned here because this image's
    # context was `site` and the door refuses a context below the repo root; the
    # context is the root now, so the reason is gone. It was also the reason the
    # build needed docker on the runner, which this fleet does not have and does
    # not want: the ephemeral pool has no daemon and the job died on a missing
    # /var/run/docker.sock.
    secrets: inherit
