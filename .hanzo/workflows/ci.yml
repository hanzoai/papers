name: ci

# Compiles every paper and fails when one does not come out. Restored from the
# deleted .github/workflows/build-papers.yml, minus the two steps that wrote to
# GitHub: a v<run_number> Release and a commit of the PDFs back to the branch.
# GitHub is a mirror now, so neither belongs here — the PDFs are the run's
# artifact and the site image bakes its own copies.
#
# This could not fail, at four depths. Every rule in the Makefile ended in
# `|| true` and printed "FAIL" rather than exiting, so `make all` returned 0
# over any number of broken papers. The defense papers were compiled by a second
# copy of the same swallowing loop, written inline in this file. The step that
# checked the PDFs
# existed was satisfied by the 100 stale PDFs that used to be committed under
# pdfs/, which the checkout supplied before the build ran. And discovery covered
# only the root, zen/ and defense/, so 69 of the repo's 219 papers were compiled
# by nothing at all.
#
# So: pdfs/ is a build output and is no longer tracked, the Makefile discovers
# every .tex with a \documentclass, and `make -k all` is the whole gate — -k to
# attempt every paper rather than stopping at the first break, and a nonzero
# status if any of them did not come out.

on:
  push:
    branches: [main]
    paths: ['**.tex', '**.bib', '**.sty', 'Makefile', '.hanzo/workflows/ci.yml']
  pull_request:
    paths: ['**.tex', '**.bib', '**.sty', 'Makefile', '.hanzo/workflows/ci.yml']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  papers:
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: install latex
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y texlive-full

      - name: compile
        run: make -k all

      # v3, NOT v4. This forge is Gitea, which presents as GHES, and the v4
      # action refuses outright:
      #   @actions/artifact v2.0.0+, upload-artifact@v4+ and download-artifact@v4+
      #   are not currently supported on GHES
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: papers
          path: pdfs/**/*.pdf
          retention-days: 90
