# Canonical caller — every knob lives in /hanzo.yml, none here.
# Runs on the git-runner fleet at git.hanzo.ai, the only pool serving these
# labels. github.com resolves only .github/workflows and has no runner for
# them, so a caller placed there is a gate that cannot be scheduled.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    with:
      # buildx, not the door: images[papers] builds from `context: site`, and
      # the door's context is the whole repository at one commit, so a
      # relative COPY would read the root. One runner means one architecture.
      mode: buildx
    secrets: inherit
